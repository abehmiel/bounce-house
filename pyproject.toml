[project]
name = "bounce-house"
version = "0.1.0"
description = "CLI tool for analyzing audio mixes — loudness, spectral balance, stereo imaging, and actionable advice"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Abe Hmiel" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "soundfile>=0.12",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyloudnorm>=0.1",
    "librosa>=0.10",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/abehmiel/bounce-house"
Repository = "https://github.com/abehmiel/bounce-house"
Issues = "https://github.com/abehmiel/bounce-house/issues"

[project.optional-dependencies]
perceptual = ["timbral_models"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.9", "mypy>=1.10", "pre-commit>=3.0"]

[project.scripts]
bounce-house = "bounce_house.cli:main"
bh = "bounce_house.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bounce_house"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
